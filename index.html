*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#26163b 0,#100a18 45%,#08060d 100%);color:#f4eff9;font-family:Seed,Arial,sans-serif}
.app{width:min(620px,100%);margin:auto;padding:42px 18px 50px}header{text-align:center;margin-bottom:28px}
.symbol{color:#d8b66c;font-size:18px;letter-spacing:8px}h1{font-size:38px;margin:9px 0 4px;font-weight:700}.sub{color:#b8adbf;font-size:15px}
.warning{margin:22px 0;padding:16px 18px;border:1px solid #503b67;border-radius:11px;background:#160e20;color:#b9afc2;font-size:13px;line-height:1.75;text-align:left}
.warning-title{color:#dfbd72;font-weight:700;font-size:15px;margin-bottom:4px}
.warning strong{color:#e5ddec}
.form{display:flex;gap:10px;margin-top:20px}input{flex:1;background:#171021;border:1px solid #514067;border-radius:10px;color:#fff;padding:15px;font:inherit;font-size:16px;outline:none}
input:focus{border-color:#9a62e8;box-shadow:0 0 16px #7f45c533}button{font:inherit;cursor:pointer}
.submit{background:linear-gradient(135deg,#d8b66c,#a87ad8);border:0;border-radius:10px;padding:0 20px;color:#120d17;font-weight:700;box-shadow:0 0 20px #9b61e633}
.hint{text-align:center;color:#756981;font-size:12px;margin-top:12px}
.result{display:none;margin-top:24px;background:#130d1c;border:1px solid #65478a;border-radius:15px;padding:24px;box-shadow:0 8px 35px #3d1b5c44}
.result.show{display:block;animation:up .3s ease}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ordered{text-align:center;color:#8e819d;font-size:13px}.menu{text-align:center;font-size:24px;font-weight:700;color:#dfbd72;margin:6px 0 20px;word-break:break-word}
.message{text-align:center;font-size:18px;line-height:1.75;margin-bottom:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{background:#1b1325;padding:13px;border-radius:9px;line-height:1.55}
.item b{display:block;color:#d8b66c;font-size:13px;margin-bottom:4px}.item span{font-size:14px;color:#e4ddec;line-height:1.5}
.lucky-time strong{display:block;text-align:center;color:#f1d18a;font-size:22px;line-height:1.35;margin:2px 0 3px}.lucky-time span{display:block;text-align:center;font-size:13px;color:#b9aec5}
.again{width:100%;margin-top:18px;padding:13px;background:transparent;border:1px solid #59476d;border-radius:9px;color:#f5efff}
@media(max-width:500px){.app{padding:35px 14px}h1{font-size:33px}.form{display:block}input{width:100%}.submit{width:100%;padding:13px;margin-top:10px}.grid{grid-template-columns:1fr}}

function predict(){

 document.getElementById("result").innerHTML=
 '<div class="ordered">เมนูที่คุณสั่ง</div><div class="menu">'+escapeHtml(menu)+'</div>'+

 '<div class="item"><b>สีมงคล</b><span>'+d.color+'</span></div>'+

 '';
 document.getElementById("result").classList.add("show");
 document.getElementById("result").scrollIntoView({behavior:"smooth"});
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}

<script id="daily-limit">
(function(){
  const KEY = "eearth_duang_daily_v1";
  const today = new Date();
  const dateKey = [
    today.getFullYear(),
    String(today.getMonth()+1).padStart(2,"0"),
    String(today.getDate()).padStart(2,"0")
  ].join("-");

  const getSaved = () => {
    try { return JSON.parse(localStorage.getItem(KEY) || "null"); }
    catch(e) { return null; }
  };

  const saved = getSaved();
  const input = document.querySelector('input[type="text"], input:not([type])');
  const buttons = Array.from(document.querySelectorAll("button"));
  const predictBtn = buttons.find(b => /ดูคำทำนาย/.test(b.textContent || "") && !/สุ่มคำทำนายใหม่/.test(b.textContent || ""));

  if (!input || !predictBtn) return;

  // Remove any old respin button if present.
  buttons.forEach(b => {
    if (/สุ่มคำทำนายใหม่/.test(b.textContent || "")) b.remove();
  });

  let playedToday = saved && saved.date === dateKey;
  let firstMenu = playedToday ? (saved.menu || "") : "";

  const overlay = document.createElement("div");
  overlay.id = "dailyLimitOverlay";
  overlay.innerHTML = `
    <div class="daily-limit-box">
      <div class="daily-limit-title">วันนี้คุณดูดวงไปแล้ว</div>
      <div class="daily-limit-text">
        คุณสามารถดูคำทำนายได้ <strong>วันละ 1 ครั้ง</strong><br>
        กรุณากลับมาใหม่ในวันถัดไปเพื่อรับคำทำนายใหม่
      </div>
      <button type="button" id="dailyLimitClose">ปิด</button>
    </div>`;
  document.body.appendChild(overlay);

  const style = document.createElement("style");
  style.textContent = `
    #dailyLimitOverlay{
      position:fixed;inset:0;display:none;align-items:center;justify-content:center;
      padding:20px;background:rgba(0,0,0,.8);z-index:2147483647;
      font-family:inherit
    }
    #dailyLimitOverlay.show{display:flex}
    .daily-limit-box{
      width:min(430px,92vw);background:#17121f;color:#fff;
      border:1px solid #c9a85b;border-radius:18px;padding:28px 24px;
      text-align:center;box-shadow:0 20px 70px rgba(0,0,0,.65)
    }
    .daily-limit-title{font-size:23px;font-weight:800;color:#e7c873;margin-bottom:14px}
    .daily-limit-text{font-size:16px;line-height:1.85;color:#f4f0f7;margin-bottom:20px}
    .daily-limit-box button{
      min-width:100px;border:0;border-radius:10px;padding:11px 20px;
      background:#c9a85b;color:#17121f;font:inherit;font-weight:800;cursor:pointer
    }`;
  document.head.appendChild(style);

  const showLimit = () => overlay.classList.add("show");
  overlay.querySelector("#dailyLimitClose").addEventListener("click", () => {
    overlay.classList.remove("show");
  });

  // If already played today, block the prediction action.
  predictBtn.addEventListener("click", function(e){
    if (playedToday) {
      e.preventDefault();
      e.stopImmediatePropagation();
      showLimit();
    }
  }, true);

  // First successful click is recorded as today's one play.
  if (!playedToday) {
    predictBtn.addEventListener("click", function(){
      const menu = (input.value || "").trim();
      if (!menu) return;
      playedToday = true;
      firstMenu = menu;
      try {
        localStorage.setItem(KEY, JSON.stringify({
          date: dateKey,
          menu: menu,
          playedAt: new Date().toISOString()
        }));
      } catch(e) {}
    });
  }
})();
</script>


<script id="dailyLock">
