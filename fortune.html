<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAILY FORTUNE</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090909;color:#fff;font-family:Arial,"Noto Sans Thai",sans-serif;display:grid;place-items:center;padding:18px}
.app{width:min(540px,100%)}.screen{background:#151515;border:1px solid #292929;border-radius:30px;padding:28px 22px;text-align:center;box-shadow:0 20px 60px #0008}
.badge{font-size:11px;letter-spacing:4px;color:#666}.date{color:#777;font-size:13px;margin-top:8px}
.orb{width:105px;height:105px;border:1px solid #3a3a3a;background:#1d1d1d;border-radius:50%;display:grid;place-items:center;font-size:48px;margin:25px auto}
h1{font-size:30px;letter-spacing:3px;margin:0}.stars{font-size:25px;letter-spacing:4px;margin-top:10px}
.fortune{background:#1d1d1d;border-radius:20px;padding:20px;text-align:left;margin-top:22px}.label{color:#666;font-size:11px;letter-spacing:2px;margin-bottom:9px}.text{font-size:18px;line-height:1.7;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.item{background:#1d1d1d;border-radius:17px;padding:15px;text-align:left;min-height:105px}.t{color:#777;font-size:12px;margin-bottom:8px}.v{font-size:14px;line-height:1.55}
.lucky{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.lucky div{background:#1d1d1d;border-radius:17px;padding:14px 5px}.lucky span{display:block;color:#666;font-size:10px;margin-bottom:7px}.lucky b{font-size:18px}
button{width:100%;border:0;border-radius:17px;background:#fff;color:#000;padding:17px;font-size:16px;font-weight:bold;margin-top:18px;cursor:pointer}.hint{color:#555;font-size:10px;margin-top:15px}
</style>
</head>
<body>
<div class="app"><div class="screen">
<div class="badge">DAILY • FORTUNE</div>
<h1>ดวงวันนี้</h1>
<div class="date" id="date"></div>
<div class="orb" id="icon">🔮</div>
<div class="stars" id="stars">☆☆☆☆☆</div>
<div class="fortune"><div class="label">TODAY'S FORTUNE</div><div class="text" id="fortune">กดปุ่มเพื่อเปิดคำทำนาย</div></div>
<div class="grid">
<div class="item"><div class="t">❤️ ความรัก</div><div class="v" id="love">—</div></div>
<div class="item"><div class="t">💼 การงาน</div><div class="v" id="work">—</div></div>
<div class="item"><div class="t">💰 การเงิน</div><div class="v" id="money">—</div></div>
<div class="item"><div class="t">🍀 โชคลาภ</div><div class="v" id="luck">—</div></div>
</div>
<div class="lucky">
<div><span>เลขนำโชค</span><b id="num">—</b></div>
<div><span>สีมงคล</span><b id="color">—</b></div>
<div><span>เวลามงคล</span><b id="time">—</b></div>
</div>
<button onclick="draw()">✦ เปิดคำทำนาย</button>
<div class="hint">คำทำนายเพื่อความบันเทิง</div>
</div></div>
<script>
const data=[
["☀️",5,"วันนี้เหมาะกับการเริ่มต้นสิ่งใหม่ สิ่งที่วางแผนไว้อาจเริ่มเห็นผล","คนโสดมีโอกาสพบคนที่น่าสนใจ","มีโอกาสได้รับความไว้วางใจให้ทำงานสำคัญ","การเงินคล่องตัว มีโอกาสได้เงินจากงานพิเศษ","มีโชคเล็ก ๆ จากคนใกล้ตัว","28","ดำ","19:00"],
["🌙",4,"เรื่องที่ดูเหมือนติดขัดจะค่อย ๆ มีทางออก หากใช้ความใจเย็น","ความสัมพันธ์ดีขึ้นจากการพูดคุย","งานหลายอย่างเข้ามาพร้อมกันแต่จัดการได้","ควรระวังการใช้จ่ายตามอารมณ์","โชคมาจากผู้ใหญ่","19","ขาว","10:30"],
["⭐",5,"มีพลังของโอกาสใหม่ สิ่งที่รอคอยอาจมีข่าวดี","มีเสน่ห์และมีคนสนใจ","เหมาะกับการเสนอไอเดียและเจรจา","มีโอกาสสร้างรายได้เพิ่ม","มีจังหวะดีจากการตัดสินใจ","45","ทอง","15:45"],
["🔥",4,"วันนี้เหมาะกับการลงมือทำ อย่าปล่อยให้ความลังเลหยุดคุณ","ระวังคำพูดตรงเกินไป","มีโอกาสปิดงานสำคัญ","รายรับมีแนวโน้มดีขึ้น","โชคมาจากความขยัน","36","แดง","11:11"],
["🌿",3,"เหมาะกับการจัดระเบียบชีวิตและเคลียร์สิ่งที่ค้าง","ความสัมพันธ์ต้องการเวลาและความเข้าใจ","อย่ารับงานเกินกำลัง","ควบคุมรายจ่ายแล้วจะมีเงินเหลือ","โชคเล็ก ๆ จากสิ่งใกล้ตัว","17","เขียว","08:30"],
["💎",5,"ความสามารถของคุณจะถูกมองเห็นและได้รับการยอมรับ","ความสัมพันธ์มีโอกาสพัฒนา","มีข่าวดีเกี่ยวกับงาน","มีโอกาสได้เงินพิเศษ","มีจังหวะดีจากคนรู้จัก","88","ม่วง","20:20"],
["🌈",4,"สิ่งที่เคยติดขัดกำลังจะมีทางออก เปิดใจรับวิธีใหม่","คนโสดมีคนเข้ามาพูดคุย","เหมาะกับการทำงานเป็นทีม","รายรับเข้ามาอย่างต่อเนื่อง","โชคจากการพบปะผู้คน","24","ฟ้า","14:14"],
["🪙",5,"วันนี้เด่นเรื่องโอกาส โดยเฉพาะด้านการเงินและการงาน","ความรักมีสัญญาณที่ดี","มีโอกาสได้รับงานใหม่","มีเกณฑ์ได้เงินเพิ่ม","มีจังหวะเกี่ยวกับตัวเลข","59","เงิน","09:09"],
["🦅",4,"วันนี้ต้องกล้าตัดสินใจ อย่าปล่อยให้ความลังเลทำให้เสียโอกาส","การพูดความรู้สึกตรง ๆ จะช่วยให้เข้าใจกัน","มีโอกาสก้าวหน้า","มีรายจ่ายแต่ยังควบคุมได้","โชคมาจากการเดินทาง","41","น้ำเงิน","16:16"],
["✨",5,"สิ่งที่พยายามมานานเริ่มมีสัญญาณของความสำเร็จ","ความสัมพันธ์มีความสุขมากขึ้น","ผลงานได้รับการยอมรับ","มีโอกาสเพิ่มรายได้","มีข่าวดีจากคนใกล้ตัว","99","ทอง","21:21"]
];
const d=new Date();
document.getElementById("date").textContent=d.toLocaleDateString("th-TH",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
function draw(){
 const f=data[Math.floor(Math.random()*data.length)];
 document.getElementById("icon").textContent=f[0];
 document.getElementById("stars").textContent="★".repeat(f[1])+"☆".repeat(5-f[1]);
 document.getElementById("fortune").textContent=f[2];
 document.getElementById("love").textContent=f[3];
 document.getElementById("work").textContent=f[4];
 document.getElementById("money").textContent=f[5];
 document.getElementById("luck").textContent=f[6];
 document.getElementById("num").textContent=f[7];
 document.getElementById("color").textContent=f[8];
 document.getElementById("time").textContent=f[9];
}
</script>
</body>
</html>
